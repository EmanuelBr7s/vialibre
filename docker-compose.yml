services:
  # ── PostgreSQL (1 DB, 3 esquemas logicos) ──
  postgres:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vialibre"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Auth Service ──
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file: .env
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/auth-service/app:/app/app

  # ── Core Service ──
  core-service:
    build:
      context: .
      dockerfile: services/core-service/Dockerfile
    env_file: .env
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/core-service/app:/app/app

  # ── Match Service ──
  match-service:
    build:
      context: .
      dockerfile: services/match-service/Dockerfile
    env_file: .env
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/match-service/app:/app/app

  # ── Frontend ──
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # Con backend arriba el frontend usa la API real vía el gateway nginx.
      # Evita que el .env.local del repo (modo mock) se imponga en Docker.
      - NEXT_PUBLIC_API_MOCK=false
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/next.config.js:/app/next.config.js

  # ── API Gateway (Nginx) ──
  nginx:
    build: ./gateway
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - core-service
      - match-service

volumes:
  pgdata:

services:
  # ── PostgreSQL (1 DB, 3 esquemas logicos) ──
  postgres:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vialibre"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Auth Service ──
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file: .env
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/auth-service/app:/app/app
      - ./services/auth-service/alembic:/app/alembic
      - ./shared/python/vialibre_common:/shared/vialibre_common

  # ── Core Service ──
  core-service:
    build:
      context: .
      dockerfile: services/core-service/Dockerfile
    env_file: .env
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/core-service/app:/app/app
      - ./services/core-service/alembic:/app/alembic
      - ./shared/python/vialibre_common:/shared/vialibre_common

  # ── Match Service ──
  match-service:
    build:
      context: .
      dockerfile: services/match-service/Dockerfile
    env_file: .env
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/match-service/app:/app/app
      - ./services/match-service/alembic:/app/alembic
      - ./shared/python/vialibre_common:/shared/vialibre_common

  # ── Frontend ──
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

  # ── API Gateway (Nginx) ──
  nginx:
    build: ./gateway
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - core-service
      - match-service

volumes:
  pgdata:

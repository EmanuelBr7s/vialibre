# Mantiene despierta la API en Render (plan gratuito).
#
# Render suspende un servicio gratuito tras 15 minutos sin tráfico y la primera
# visita después tarda alrededor de un minuto. Esta tarea consulta /health cada
# 10 minutos para que eso no le ocurra a un usuario real.
#
# - Solo toca /health del gateway: no consulta la base de datos, así que Neon
#   puede seguir suspendiéndose sin gastar su cuota de cómputo.
# - La URL se puede cambiar sin editar este archivo con la variable de
#   repositorio API_HEALTH_URL (Settings → Secrets and variables → Actions → Variables).
# - Para pausarlo: Actions → «Mantener API despierta» → ⋯ → Disable workflow.
# - GitHub desactiva las tareas programadas tras 60 días sin actividad en el
#   repositorio; se reactivan desde la pestaña Actions.
name: Mantener API despierta

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://vialibre-api.onrender.com/health' }}
    steps:
      - name: Consultar /health
        run: |
          # Si el servicio estaba dormido, la primera respuesta tarda: se espera
          # hasta 150 s y se reintenta dos veces antes de marcar el fallo.
          curl --fail --silent --show-error --max-time 150 \
               --retry 2 --retry-delay 10 --retry-all-errors \
               --output /dev/null \
               --write-out "HTTP %{http_code} en %{time_total}s\n" \
               "$HEALTH_URL"
